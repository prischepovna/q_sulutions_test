ServerName localhost

<VirtualHost *:80>
    ServerName localhost

    # логи в stdout/stderr, чтобы их видел docker compose logs
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    # размер видео не ограничен
    LimitRequestBody 0

    WSGIDaemonProcess videoapp processes=2 threads=4 home=/app
    WSGIProcessGroup videoapp
    WSGIApplicationGroup %{GLOBAL}

    # видео раздаёт Apache напрямую
    Alias /media/ /app/uploads/
    <Directory /app/uploads>
        Require all granted
    </Directory>

    WSGIScriptAlias / /app/app.wsgi
    <Directory /app>
        <Files app.wsgi>
            Require all granted
        </Files>
    </Directory>
</VirtualHost>